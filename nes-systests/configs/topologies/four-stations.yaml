# Topology:
#
#   ┌──────────────────────┐
#   │ station-01:8080 (S)  │──┐
#   └──────────────────────┘  │
#   ┌──────────────────────┐  │
#   │ station-02:8080 (S)  │──┤     ┌──────────────────────────┐
#   └──────────────────────┘  ├────►│ sink-node:8080 (K)       │
#   ┌──────────────────────┐  │     │ capacity: 10000          │
#   │ station-03:8080 (S)  │──┤     └──────────────────────────┘
#   └──────────────────────┘  │
#   ┌──────────────────────┐  │
#   │ station-04:8080 (S)  │──┘
#   └──────────────────────┘
#
#  systest -g FourStations --clusterConfig nes-systests/configs/topologies/four-stations.yaml
workers:
  - host: "sink-node:8080"
    data_address: "sink-node:9090"
    max_operators: 10000

  - host: "station-01:8080"
    data_address: "station-01:9090"
    max_operators: 16
    downstream:
      - "sink-node:8080"

  - host: "station-02:8080"
    data_address: "station-02:9090"
    max_operators: 16
    downstream:
      - "sink-node:8080"

  - host: "station-03:8080"
    data_address: "station-03:9090"
    max_operators: 16
    downstream:
      - "sink-node:8080"

  - host: "station-04:8080"
    data_address: "station-04:9090"
    max_operators: 16
    downstream:
      - "sink-node:8080"

allow_source_placement:
  - "station-01:8080"
  - "station-02:8080"
  - "station-03:8080"
  - "station-04:8080"

allow_sink_placement:
  - "sink-node:8080"
